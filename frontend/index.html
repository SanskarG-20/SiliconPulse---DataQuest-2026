<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiliconPulse — Signal-First Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { width: 100%; height: 100%; }
        :root {
            /* Light Mode Variables */
            --void: #F8FAFC;
            --panel: #FFFFFF;
            --panel-soft: rgba(255,255,255,0.84);
            --hairline: #E2E8F0;
            --hairline-soft: rgba(226,232,240,0.9);
            --euv: #0284C7; /* Darker cyan/blue for better contrast in light mode */
            --euv-soft: rgba(2,132,199,0.12);
            --copper: #D97706; /* Darker amber for contrast */
            --copper-soft: rgba(217,119,6,0.14);
            --signal: #0F172A;
            --body: #334155;
            --muted: #64748B;
            --input-bg: #FFFFFF;
            --grid: rgba(2,132,199,0.06);
            --radius: 16px;
            color-scheme: light;
        }

        html.dark {
            /* Dark Mode Variables (Default) */
            --void: #050B1A;
            --panel: #0E1E32;
            --panel-soft: rgba(14,30,50,0.72);
            --hairline: #1C3553;
            --hairline-soft: rgba(28,53,83,0.5);
            --euv: #22D3EE;
            --euv-soft: rgba(34,211,238,0.12);
            --copper: #E8A253;
            --copper-soft: rgba(232,162,83,0.14);
            --signal: #F1F5F9;
            --body: #CBD5E1;
            --muted: #94A3B8;
            --input-bg: #050B1A;
            --grid: rgba(34,211,238,0.06);
            color-scheme: dark;
        }

        html { scrollbar-width: thin; scrollbar-color: var(--hairline) transparent; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--void);
            color: var(--signal);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            transition: background-color 0.2s, color 0.2s;
        }
        /* Type scale */
        .display { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.03em; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .serif { font-family: 'Newsreader', serif; }
        
        /* Glass / panel */
        .glass {
            background: var(--panel-soft);
            backdrop-filter: blur(14px) saturate(1.1);
            border: 1px solid var(--hairline-soft);
        }
        .glass-hover { transition: border-color 200ms, background 200ms, transform 200ms, box-shadow 200ms; }
        .glass-hover:hover {
            border-color: rgba(34,211,238,0.32);
            background: var(--panel);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1), 0 0 0 1px var(--euv-soft);
        }
        .hairline { border-color: var(--hairline-soft); }

        /* Semantic theme primitives — use these for all new components
           so Light/Dark inherit automatically instead of one-off overrides. */
        .t-primary { color: var(--signal); }
        .t-body { color: var(--body); }
        .t-muted { color: var(--muted); }
        .panel {
            background: var(--panel-soft);
            border: 1px solid var(--hairline-soft);
            backdrop-filter: blur(14px) saturate(1.1);
        }
        .panel-solid {
            background: var(--panel);
            border: 1px solid var(--hairline-soft);
        }
        .well { background: var(--input-bg); border: 1px solid var(--hairline-soft); }
        .field {
            background: var(--input-bg);
            border: 1px solid var(--hairline);
            color: var(--signal);
        }
        .field::placeholder { color: var(--muted); opacity: 0.75; }
        .btn-ghost {
            background: var(--panel);
            border: 1px solid var(--hairline);
            color: var(--muted);
            transition: color 150ms, border-color 150ms, background 150ms;
        }
        .btn-ghost:hover { color: var(--signal); border-color: var(--euv); }

        /* Theme-aware scene (Backdrop) — replaces hardcoded dark gradients */
        .scene-vignette {
            background:
                radial-gradient(900px 600px at 20% -10%, rgba(2,132,199,0.10), transparent 60%),
                radial-gradient(700px 500px at 90% 110%, rgba(217,119,6,0.08), transparent 60%),
                radial-gradient(600px 400px at 50% 50%, #FFFFFF 0%, #EDF2F7 70%);
        }
        html.dark .scene-vignette {
            background:
                radial-gradient(900px 600px at 20% -10%, rgba(34,211,238,0.08), transparent 60%),
                radial-gradient(700px 500px at 90% 110%, rgba(232,162,83,0.07), transparent 60%),
                radial-gradient(600px 400px at 50% 50%, #0E1E32 0%, #050B1A 70%);
        }
        .scene-reticle { border-color: var(--hairline); }
        .scene-ring { border-color: var(--hairline-soft); }
        
        /* Focus */
        :where(a, button, input, select, textarea):focus-visible {
            outline: 2px solid var(--euv);
            outline-offset: 2px;
            border-radius: 6px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: var(--hairline) transparent; }
        
        /* Blueprint grid */
        .blueprint-grid {
            background-image:
                linear-gradient(to right, var(--grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .blueprint-grid-fine {
            background-image:
                linear-gradient(to right, var(--grid) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
            background-size: 8px 8px;
        }
        
        /* Ticker */
        .ticker-scroll { animation: ticker 80s linear infinite; }
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .ticker-scroll { animation: none; }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script>
        /* Pre-paint theme init: single source of truth with useDashboard.
           Prevents stale first paint (dark shell flashing before light applies). */
        try {
            var t = localStorage.getItem('siliconpulse_theme');
            if (t !== 'light' && t !== 'dark') {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            }
            if (t === 'light') document.documentElement.classList.remove('dark');
            else document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = t;
        } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
